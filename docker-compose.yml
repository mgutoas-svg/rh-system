version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rh-postgres
    environment:
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password
      POSTGRES_DB: rh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./packages/api
    container_name: rh-api
    environment:
      DATABASE_URL: postgresql://rh_user:rh_password@postgres:5432/rh_db
      JWT_SECRET: dev-secret-change-in-prod
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm dev

volumes:
  postgres_data:
