version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rh-postgres
    environment:
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password
      POSTGRES_DB: rh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
